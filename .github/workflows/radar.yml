name: radar
on:
  # news scanning now runs every 10 min inside the always-on listen job; this is for manual runs only
  workflow_dispatch:
    inputs:
      mode: {description: 'scan or selftest', default: scan}
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -q -r requirements.txt
      - name: scan
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: |
          mkdir -p state
          set -o pipefail
          python radar.py ${{ github.event.inputs.mode || 'scan' }} 2>&1 | tee state/last_run.log
      - name: save state
        if: always()
        run: |
          git config user.name chain-radar; git config user.email noreply@github.com
          git add state/seen.json state/last_run.log state/selftest 2>/dev/null; [ -f state/shorts.json ] && git add state/shorts.json; git add state/last_run.log && git commit -qm "radar state [skip ci]" && for i in 1 2 3 4; do git pull --rebase -q -X theirs && git push -q && break; sleep 3; done || true
