name: ytresearch
on: {workflow_dispatch: {}}
permissions: {contents: write}
jobs:
  r:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: pip install -q requests && python research/yt_formats.py
        env: {YOUTUBE_API_KEY: '${{ secrets.YOUTUBE_API_KEY }}'}
      - run: |
          git config user.name chain-radar; git config user.email noreply@github.com
          git add research/yt_formats.json && git commit -qm "yt format research [skip ci]" && for i in 1 2 3 4 5; do git pull -q --rebase -X theirs && git push -q && break; sleep 4; done
