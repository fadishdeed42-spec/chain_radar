name: listen
# Every 5 min: handle Telegram taps (📝 Make post), /top and pasted links
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
    inputs:
      mode: {description: 'listen or top', default: listen}
permissions:
  contents: write
concurrency:
  group: radar
  cancel-in-progress: false
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -q -r requirements.txt
      - name: listen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p state
          set -o pipefail
          python radar.py ${{ github.event.inputs.mode || 'listen' }} 2>&1 | tee state/listen.log
      - name: save state
        if: always()
        run: |
          git config user.name chain-radar; git config user.email noreply@github.com
          git add state && git commit -qm "listen state [skip ci]" && for i in 1 2 3; do git pull --rebase -q && git push -q && break; sleep 3; done || true
