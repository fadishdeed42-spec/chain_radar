name: listen
# Long-polls Telegram ~4.5 min per run (restarted every 5 min) so taps & commands are answered in seconds
on:
  schedule:
    - cron: '*/5 * * * *'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: listen
  cancel-in-progress: false
jobs:
  listen:
    runs-on: ubuntu-latest
    timeout-minutes: 9
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -q -r requirements.txt
      - name: listen
        env:
          TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          mkdir -p state
          set -o pipefail
          python -u radar.py listen 2>&1 | tee state/listen.log
      - name: save state
        if: always()
        run: |
          git config user.name chain-radar; git config user.email noreply@github.com
          git add state/tg.json state/listen.log && git commit -qm "listen state [skip ci]" && for i in 1 2 3 4; do git pull --rebase -q -X theirs && git push -q && break; sleep 3; done || true
