name: scripttest
# Write a Short script exactly like the bot does, without Telegram: prints it with the standard check.
on:
  workflow_dispatch:
    inputs:
      topic: {required: true}
      length: {required: false, default: '45'}
jobs:
  draft:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: pip install -q -r requirements.txt 2>/dev/null || pip install -q requests feedparser
      - env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          YOUTUBE_API_KEY: ${{ secrets.YOUTUBE_API_KEY }}
        run: python3 tests/draft_live.py "${{ inputs.topic }}" "${{ inputs.length }}" 2>&1 | tail -120
