name: research
# Fetches real market data for long-video research (sites blocked elsewhere) and commits research/prices.json.
on:
  workflow_dispatch:
    inputs:
      start: {description: 'first date YYYY-MM-DD', default: '2026-02-01'}
permissions:
  contents: write
jobs:
  prices:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - run: pip install -q requests
      - run: python research/fetch_prices.py ${{ github.event.inputs.start }} | tee /tmp/out.txt; sed 's/^/::notice title=prices::/' /tmp/out.txt
      - run: |
          git config user.name chain-radar; git config user.email noreply@github.com
          git add research/prices.json && git commit -qm "research prices [skip ci]" && for i in 1 2 3 4 5; do git pull --rebase -q -X theirs && git push -q && break; sleep 4; done || true
