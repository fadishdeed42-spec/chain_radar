name: tests
# Manual only. Runs the unit tests, then (optionally) live checks that call the real AI. Changes nothing in the repo, sends nothing to Telegram.
on:
  workflow_dispatch:
    inputs:
      live: {description: 'live checks to run: none | length | replies | package | chart | all', default: none}
permissions:
  contents: write   # only to publish sample images to the throwaway 'samples' branch
jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12', cache: pip}
      - run: pip install -q -r requirements.txt
      - name: unit tests
        run: python tests/run.py
      - name: live checks
        if: github.event.inputs.live != 'none'
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GEMINI_API_KEY_2: ${{ secrets.GEMINI_API_KEY_2 }}
          TELEGRAM_TOKEN: unused
          TELEGRAM_CHAT_ID: '0'
        run: python tests/live.py ${{ github.event.inputs.live }}
      - name: publish sample images (branch "samples" only, never main)
        if: always() && github.event.inputs.live != 'none'
        run: |
          [ -d sample_out ] || exit 0
          git config user.name "tests"; git config user.email "tests@users.noreply.github.com"
          git checkout --orphan samples; git rm -rf . -q 2>/dev/null || true
          mkdir -p s && cp sample_out/*.png s/ && git add s && git commit -q -m "samples" && git push -f -q origin samples
